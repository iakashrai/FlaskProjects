{% extends "layout.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="auth-card">
    <p class="eyebrow">WELCOME BACK</p><h1>Sign in to Shortly</h1><p class="muted">Manage your links from one simple dashboard.</p>
    <form method="post" class="auth-form">
        <label for="username">Username</label><input id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button button-full" type="submit">Sign in</button>
    </form>
    <p class="auth-footer">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
