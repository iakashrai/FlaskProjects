{% extends "layout.html" %}
{% block title %}Link ready{% endblock %}
{% block content %}
<section class="result-card">
    <div class="success-icon">✓</div>
    <p class="eyebrow">YOUR LINK IS READY</p>
    <h1>Share it anywhere.</h1>
    <p class="muted">Your long URL has been shortened successfully.</p>
    <div class="copy-row">
        <input id="short-url" value="{{ short_url }}" readonly>
        <button class="button" type="button" onclick="navigator.clipboard.writeText(document.getElementById('short-url').value); this.textContent='Copied!'">Copy link</button>
    </div>
    <a class="back-link" href="{{ url_for('index') }}">← Shorten another link</a>
</section>
{% endblock %}
